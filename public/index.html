<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落叶归根 · Crazy 的个人站</title>
<meta name="description" content="Crazy 的个人主页 —— 喜欢动漫、爱玩游戏，追星乐正绫与洛天依。">
<link rel="icon" href="img/me.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("crazy-theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="bg-deco" aria-hidden="true"></div>

<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="index.html">Crazy<span>.</span></a>
    <nav class="nav__links" aria-label="主导航">
      <a href="index.html" class="is-active" aria-current="page">主页</a>
      <a href="HomPage.html">介绍</a>
      <a href="MyWorks.html">作品</a>
      <a href="MyContact.html">联系</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换深色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <!-- ===== Hero ===== -->
  <section class="hero">
    <div class="container">
      <div class="hero__grid">
        <div class="hero__text">
          <span class="hero__eyebrow">Personal Blog</span>

          <div class="hero__id">
            <img class="hero__avatar" src="img/me.png" width="60" height="60" alt="Crazy 的头像">
            <div>
              <div class="hero__id-name">Crazy.</div>
              <div class="hero__id-sub">@埃及</div>
            </div>
          </div>

          <h1 class="hero__title">大家好！<br>我是 <em>crazy</em></h1>
          <p class="hero__desc">欢迎来到我的破站</p>

          <div class="hero__actions">
            <a class="btn btn--primary" href="HomPage.html">了解我 →</a>
            <a class="btn btn--ghost" href="MyWorks.html">看作品</a>
          </div>
        </div>

        <div class="hero__media">
          <div class="slider" data-slider tabindex="0" role="group" aria-label="照片轮播">
            <div class="slider__slide is-active">
              <img src="img/banner.jpg" width="1920" height="1440" alt="举着 CRAZY 牌子的照片">
            </div>
            <div class="slider__slide">
              <img src="img/banner1.jpg" width="1920" height="1440" alt="举着 CRAZY 牌子的另一张照片" loading="lazy">
            </div>

            <button class="slider__arrow slider__arrow--prev" type="button" aria-label="上一张">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="slider__arrow slider__arrow--next" type="button" aria-label="下一张">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>

            <div class="slider__dots"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 个人能力介绍 ===== -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <span class="section-head__label">About Me</span>
        <h2 class="section-head__title">个人能力介绍</h2>
      </div>

      <div class="skills">
        <div class="skill reveal">
          <span class="skill__num">一</span>
          <p class="skill__text">本人啥也不会</p>
        </div>
        <div class="skill reveal">
          <span class="skill__num">二</span>
          <p class="skill__text">本人喜欢动漫，平常爱玩玩游戏。</p>
        </div>
        <div class="skill reveal">
          <span class="skill__num">三</span>
          <p class="skill__text">本人不善言辞，有点社恐</p>
        </div>
        <div class="skill skill--quote reveal">
          <span class="skill__num">四</span>
          <p class="skill__text">送给大家一句话：待到秋来九月八，我花开后百花杀</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div>
      <div class="footer__brand">Crazy<span>.</span></div>
      <p class="footer__line">路再远再蜿蜒仍是个圈，缘起处注定盘桓成终点。</p>
    </div>
    <nav class="footer__nav" aria-label="页脚导航">
      <a href="index.html">主页</a>
      <a href="HomPage.html">介绍</a>
      <a href="MyWorks.html">作品</a>
      <a href="MyContact.html">联系</a>
    </nav>
  </div>
  <div class="footer__copy">Copyright 2017. Studio Crazy All Rights Reserved.</div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
