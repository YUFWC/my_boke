<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · 落叶归根</title>
<link rel="icon" href="img/me.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("crazy-theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  .lost {
    min-height: calc(100vh - 260px);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 60px 0;
  }
  .lost__code {
    font-size: clamp(80px, 18vw, 150px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(120deg, var(--accent), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lost__title {
    margin-top: 18px;
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 700;
  }
  .lost__desc {
    margin-top: 10px;
    color: var(--text-muted);
  }
  .lost__actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div class="bg-deco" aria-hidden="true"></div>

<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="/">Crazy<span>.</span></a>
    <nav class="nav__links" aria-label="主导航">
      <a href="/">主页</a>
      <a href="/HomPage.html">介绍</a>
      <a href="/MyWorks.html">作品</a>
      <a href="/MyContact.html">联系</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换深色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="container">
    <div class="lost">
      <div>
        <div class="lost__code">404</div>
        <h1 class="lost__title">这条路没走到头</h1>
        <p class="lost__desc">你要找的页面不在这里，可能是链接写错了，也可能它已经搬走了。</p>
        <div class="lost__actions">
          <a class="btn btn--primary" href="/">回主页</a>
          <a class="btn btn--ghost" href="/MyWorks.html">看作品</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div>
      <div class="footer__brand">Crazy<span>.</span></div>
      <p class="footer__line">路再远再蜿蜒仍是个圈，缘起处注定盘桓成终点。</p>
    </div>
    <nav class="footer__nav" aria-label="页脚导航">
      <a href="/">主页</a>
      <a href="/HomPage.html">介绍</a>
      <a href="/MyWorks.html">作品</a>
      <a href="/MyContact.html">联系</a>
    </nav>
  </div>
  <div class="footer__copy">Copyright 2017. Studio Crazy All Rights Reserved.</div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
